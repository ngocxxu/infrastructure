global:
  postgresql:
    auth:
      # Use existing secret with mapped password key from DopplerSecret
      existingSecret: postgresql-env
      secretKeys:
        adminPasswordKey: postgres-password
        userPasswordKey: postgres-password

primary:
  # Load all other environment variables from Doppler secret
  # All variables with UPPERCASE names from Doppler will be available
  extraEnvVarsSecret: postgresql-env
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "local-path"
  resources:
    limits:
      memory: 200Mi
      cpu: 100m
    requests:
      memory: 96Mi
      cpu: 50m
  podSecurityContext:
    fsGroup: 1001
  containerSecurityContext:
    runAsUser: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false

image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: 17.6.0-debian-12-r4
