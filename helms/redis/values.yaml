global:
  redis:
    password: ""

image:
  repository: bitnamilegacy/redis
  tag: 8.2.1-debian-12-r0

auth:
  enabled: true
  password: ""

master:
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "local-path"

  resources:
    limits:
      memory: 30Mi
      cpu: 80m
    requests:
      memory: 10Mi
      cpu: 40m
  
  readinessProbe:
    exec:
      command: ["redis-cli", "ping"]    

  livenessProbe:
    exec:
      command: ["redis-cli", "ping"]

  podSecurityContext:
    fsGroup: 1001

  containerSecurityContext:
    runAsUser: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false

replica:
  replicaCount: 1
  persistence:
    enabled: true
    size: 0.5Gi
    storageClass: "local-path"

  resources:
    limits:
      memory: 30Mi
      cpu: 80m
    requests:
      memory: 10Mi
      cpu: 40m
  
  readinessProbe:
    exec:
      command: ["redis-cli", "ping"]    

  livenessProbe:
    exec:
      command: ["redis-cli", "ping"]  

  podSecurityContext:
    fsGroup: 1001

  containerSecurityContext:
    runAsUser: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false