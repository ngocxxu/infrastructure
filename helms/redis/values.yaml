image:
  repository: bitnamilegacy/redis
  tag: 8.2.1-debian-12-r0

auth:
  enabled: true
  # Use existing secret with mapped password key from DopplerSecret
  existingSecret: redis-env
  existingSecretPasswordKey: redis-password

master:
  # Load all other environment variables from Doppler secret
  # All variables with UPPERCASE names from Doppler will be available
  extraEnvVarsSecret: redis-env
  persistence:
    enabled: true
    size: 1Gi
    storageClass: "local-path"
  resources:
    limits:
      memory: 30Mi
      cpu: 80m
    requests:
      memory: 10Mi
      cpu: 40m
  readinessProbe:
    exec:
      command:
        ["bash", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping | grep PONG']
  livenessProbe:
    exec:
      command:
        ["bash", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping | grep PONG']
  podSecurityContext:
    fsGroup: 1001
  containerSecurityContext:
    runAsUser: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false

replica:
  # Load all other environment variables from Doppler secret
  # All variables with UPPERCASE names from Doppler will be available
  extraEnvVarsSecret: redis-env
  replicaCount: 1
  persistence:
    enabled: true
    size: 0.5Gi
    storageClass: "local-path"
  resources:
    limits:
      memory: 30Mi
      cpu: 80m
    requests:
      memory: 10Mi
      cpu: 40m
  readinessProbe:
    enabled: false
  livenessProbe:
    enabled: false
  podSecurityContext:
    fsGroup: 1001
  containerSecurityContext:
    runAsUser: 1001
    runAsNonRoot: true
    allowPrivilegeEscalation: false