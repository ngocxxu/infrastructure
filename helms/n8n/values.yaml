# Override values for n8n community chart
# Chart: https://artifacthub.io/packages/helm/community-charts/n8n

replicaCount: 1

image:
  repository: n8nio/n8n
  tag: "1.95.0"
  pullPolicy: IfNotPresent

secret:
  database:
    existingSecret: n8n-env
    existingSecretKey: DB_POSTGRESDB_PASSWORD
  encryption:
    existingSecret: n8n-env
    existingSecretKey: N8N_ENCRYPTION_KEY

config:
  database:
    type: postgresdb
    postgresdb:
      host: postgresql.shared.svc.cluster.local
      port: 5432
      database: n8n
      user: n8n
  
  generic:
    timezone: Asia/Ho_Chi_Minh
  
  executions:
    pruneData: true
    pruneDataMaxAge: 168

ingress:
  enabled: true
  className: traefik
  hosts:
    - host: n8n.ngocquach.com
      paths:
        - path: /
          pathType: Prefix

persistence:
  enabled: true
  storageClass: local-path
  size: 1Gi

resources:
  requests:
    memory: 100Mi
    cpu: 50m
  limits:
    memory: 200Mi
    cpu: 150m

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 60
  periodSeconds: 15
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 45
  periodSeconds: 10
  failureThreshold: 5
