apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gotk-components.yaml
  - gotk-sync.yaml
  - infrastructure.yaml
  - apps-shared.yaml
  - apps-project-vocab.yaml
  # - apps-project-paracord-store.yaml
  - apps-monitoring.yaml
  - apps-external.yaml
  - apps-debezium-pipeline.yaml

# Right-size the Flux controllers' hardcoded 1Gi/1000m limits.
# See flux-resource-limits.yaml for the rationale.
patches:
  - path: flux-resource-limits.yaml
