# Shared Resources Layer - Databases (PostgreSQL, Redis)
# Must be installed before applications
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-shared
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./clusters/mmo-vps/apps/shared
  dependsOn:
    - name: infrastructure
  prune: true
  wait: true

