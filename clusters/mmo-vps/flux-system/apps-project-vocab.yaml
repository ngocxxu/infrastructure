# Project Vocab Layer - Applications (vocab-be, vocab-fe)
# Depends on shared databases
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-project-vocab
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./clusters/mmo-vps/apps/project-vocab
  dependsOn:
    - name: infrastructure
    - name: apps-shared # Wait for shared databases to be installed first
  prune: true
  wait: true
