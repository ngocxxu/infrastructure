# External Layer - Weave GitOps UI
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-external
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./clusters/mmo-vps/apps/external
  dependsOn:
    - name: infrastructure # Wait for Doppler Operator to be installed
  prune: true
  wait: true
