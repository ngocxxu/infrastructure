# Shared Secrets Layer - Must run before shared apps
# Creates DopplerSecret resources that generate the required secrets
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-shared-secrets
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./clusters/mmo-vps/apps/shared-secrets
  dependsOn:
    - name: infrastructure
  prune: true
  wait: true
