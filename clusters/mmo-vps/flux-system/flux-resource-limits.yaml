# ============================================================
# Flux controller resource right-sizing
# ============================================================
# gotk-components.yaml ships every controller with a hardcoded
# 1Gi / 1000m limit. On this single node (3 CPU / 4.7Gi allocatable)
# that alone reserved 6Gi of memory limits and 6 CPU of limits —
# the bulk of the "limits are higher than node capacity" warning.
#
# Real observed usage:
#   image-reflector-controller   160Mi   15m
#   kustomize-controller          66Mi   11m
#   source-controller             50Mi    2m
#   helm-controller               42Mi    1m
#   image-automation-controller   30Mi    1m
#   notification-controller       27Mi    2m
#
# Limits below give ~2-4x headroom over observed peak.
#
# NOTE: patched here rather than edited in gotk-components.yaml,
# because that file is regenerated by `flux bootstrap` and any
# direct edit would be silently reverted on the next upgrade.
#
# BONUS: the controllers set GOMEMLIMIT from limits.memory via
# resourceFieldRef, so lowering the limit also tightens Go's GC
# target — they will actually hold less RSS, not just be capped.
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: source-controller
  namespace: flux-system
spec:
  template:
    spec:
      containers:
        - name: manager
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kustomize-controller
  namespace: flux-system
spec:
  template:
    spec:
      containers:
        - name: manager
          resources:
            requests:
              cpu: 25m
              memory: 80Mi
            limits:
              cpu: 500m
              memory: 192Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helm-controller
  namespace: flux-system
spec:
  template:
    spec:
      containers:
        - name: manager
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-controller
  namespace: flux-system
spec:
  template:
    spec:
      containers:
        - name: manager
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 300m
              memory: 128Mi
---
apiVersion: apps/v1
