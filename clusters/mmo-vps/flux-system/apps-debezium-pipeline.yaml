# Separate Kustomization for the DebeziumServer CR, kept apart from
# apps-external on purpose - see the comment block in
# apps/external/debezium.yaml and apps/debezium-pipeline/debezium-server.yaml
# for why (CRD-and-CR-in-one-batch deadlock).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-debezium-pipeline
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./clusters/mmo-vps/apps/debezium-pipeline
  dependsOn:
    # Waits for debezium-operator's HelmRelease (in apps-external) to be
    # Ready, which is what guarantees the debezium.io CRDs actually exist
    # before this Kustomization dry-run-validates the DebeziumServer CR.
    - name: apps-external
  prune: true
  wait: true
