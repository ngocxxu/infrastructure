# Apps Layer - Depends on infrastructure
# Installs applications, databases, and project resources
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 1m
  retryInterval: 1m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  path: ./clusters/mmo-vps/apps
  dependsOn:
    - name: infrastructure
  prune: true
  wait: true
