# Helm Repository for Bitnami charts
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.bitnami.com/bitnami

---
# Helm Repository for Doppler Operator
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: doppler-helm
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.doppler.com

---
# Helm Repository for Weave GitOps
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: weave-gitops
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.gitops.weave.works

