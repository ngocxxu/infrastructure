# Doppler Kubernetes Operator
# This must be installed before any DopplerSecret resources
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: doppler-kubernetes-operator
  namespace: flux-system
spec:
  interval: 5m
  timeout: 5m
  chart:
    spec:
      chart: doppler-kubernetes-operator
      sourceRef:
        kind: HelmRepository
        name: doppler-helm
        namespace: flux-system
      version: "1.7.1"
  values:
    controllerManager:
      resources:
        limits:
          cpu: 50m
          memory: 30Mi
        requests:
          cpu: 20m
          memory: 15Mi
