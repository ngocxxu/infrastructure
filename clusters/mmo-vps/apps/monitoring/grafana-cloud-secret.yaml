# DopplerSecret for Grafana Cloud credentials
# Store these variables in Doppler (Project: your-project, Config: your-config):
# - GRAFANA_PROMETHEUS_HOST (e.g., https://prometheus-prod-xx-prod-us-central-0.grafana.net)
# - GRAFANA_PROMETHEUS_USERNAME (e.g., 123456 - User ID from Grafana Cloud)
# - GRAFANA_PROMETHEUS_PASSWORD (e.g., glc_xxxxxx - Cloud Access Policy Token)
# - GRAFANA_LOKI_HOST (e.g., https://logs-prod-xx-prod-us-central-0.grafana.net)
# - GRAFANA_LOKI_USERNAME (e.g., 123456 - User ID from Grafana Cloud)
# - GRAFANA_LOKI_PASSWORD (e.g., glc_xxxxxx - Cloud Access Policy Token)
#
# To get these values:
# 1. Go to Grafana Cloud Portal
# 2. For Prometheus: Settings → Connections → Prometheus → Send metrics
# 3. For Loki: Settings → Connections → Loki → Send logs
#
# This secret must be created manually:
# kubectl create secret generic doppler-token-grafana-cloud --namespace monitoring --from-literal=serviceToken=dp.st.xxxxx
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: grafana-cloud-secret-ref
  namespace: monitoring
spec:
  tokenSecret:
    name: doppler-token-grafana-cloud
    namespace: monitoring
  managedSecret:
    name: grafana-cloud-env
    namespace: monitoring
