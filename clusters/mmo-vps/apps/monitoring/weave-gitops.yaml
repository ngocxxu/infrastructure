# Weave GitOps UI Dashboard
# Provides web UI for FluxCD management and monitoring
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: weave-gitops
  namespace: flux-system
spec:
  interval: 5m
  chart:
    spec:
      chart: weave-gitops
      sourceRef:
        kind: HelmRepository
        name: weave-gitops
        namespace: flux-system
      version: "4.0.x"
  targetNamespace: flux-system
  install:
    createNamespace: false
  values:
    adminUser:
      create: true
      username: admin
    service:
      type: ClusterIP
      port: 9001
    ingress:
      enabled: true
      className: "traefik"
      annotations: {}
      hosts:
        - host: gitops.ngocquach.top
          paths:
            - path: /
              pathType: Prefix
    extraEnvVarsSecret: weave-gitops-env
  valuesFrom:
    - kind: Secret
      name: weave-gitops-env
      valuesKey: ADMIN_PASSWORD_HASH
      targetPath: adminUser.passwordHash
