apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s-monitoring
      version: "1.6.5"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

  install:
    createNamespace: true
  targetNamespace: monitoring

  # 1. Inject Secrets
  valuesFrom:
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_HOST
      targetPath: externalServices.prometheus.host
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_USERNAME
      targetPath: externalServices.prometheus.basicAuth.username
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_PASSWORD
      targetPath: externalServices.prometheus.basicAuth.password
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_HOST
      targetPath: externalServices.loki.host
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_USERNAME
      targetPath: externalServices.loki.basicAuth.username
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_PASSWORD
      targetPath: externalServices.loki.basicAuth.password

  # 2. Configure Values (V1 Legacy Style - Simple & Working)
  values:
    cluster:
      name: "mmo-vps"

    # Destination configuration (V1 style)
    externalServices:
      prometheus:
        secret:
          create: false # Use injected secrets
      loki:
        secret:
          create: false

    # Metrics Configuration
    metrics:
      enabled: true
      # V1 uses 'cost' (not opencost)
      cost:
        enabled: false

      node-exporter:
        enabled: true

      kube-state-metrics:
        enabled: true

      # V1 Agent configuration for filtering metrics
      agent:
        enabled: true
        # Resource limits for the agent pod
        resources:
          requests:
            cpu: 50m
            memory: 200Mi
          limits:
            memory: 500Mi
        # Metric filtering rules (V1 Syntax)
        extraRelabelingRules: |
          - action: drop
            source_labels: [__name__]
            regex: "container_network_.*"
          - action: drop
            source_labels: [__name__]
            regex: "kube_pod_owner"

    # Logs Configuration
    logs:
      enabled: true
      pod_logs:
        enabled: true
        namespaces:
          - default
          - kube-system
          - flux-system
          - monitoring
          - shared
          - project-vocab

      cluster_events:
        enabled: true

    # Disable unused receivers
    receivers:
      grpc: { enabled: false }
      http: { enabled: false }
      zipkin: { enabled: false }

    # Disable Kepler (V1 syntax might differ, but this is safe)
    kepler:
      enabled: false
