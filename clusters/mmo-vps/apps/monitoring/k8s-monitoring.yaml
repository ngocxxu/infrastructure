apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s-monitoring
      version: "^3.6.0" # Latest V3
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

  install:
    createNamespace: true
  targetNamespace: monitoring

  # ⚠️ CRITICAL UPDATE: Updated 'targetPath' to match V3 'destinations' structure
  # V3 uses an array for destinations, so we use index [0] and [1]
  valuesFrom:
    # Destination [0]: Prometheus
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_HOST
      targetPath: destinations[0].url
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_USERNAME
      targetPath: destinations[0].auth.username
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_PASSWORD
      targetPath: destinations[0].auth.password
    
    # Destination [1]: Loki
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_HOST
      targetPath: destinations[1].url
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_USERNAME
      targetPath: destinations[1].auth.username
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_PASSWORD
      targetPath: destinations[1].auth.password

  # 2. Configure Values (Migrated to V3 Schema)
  values:
    cluster:
      name: "mmo-vps"

    # --- MIGRATION: externalServices -> destinations ---
    destinations:
      - name: prometheus
        type: prometheus
        auth:
          type: basic
      - name: loki
        type: loki
        auth:
          type: basic

    # --- MIGRATION: metrics -> clusterMetrics ---
    clusterMetrics:
      enabled: true
      # Disable OpenCost to save resources (was 'metrics.cost' in V1)
      opencost:
        enabled: false
      
      # V3 uses camelCase keys
      nodeExporter:
        enabled: true
      kubelet:
        enabled: true
      kubeStateMetrics:
        enabled: true
      cadvisor:
        enabled: true
        # Drop high-cardinality network metrics
        extraMetricProcessingRules: |-
          action = "drop"
          source_labels = ["__name__"]
          regex = "container_network_.*"

    # --- MIGRATION: logs -> podLogs ---
    podLogs:
      enabled: true
      namespaces:
        - default
        - kube-system
        - flux-system
        - monitoring
        - shared
        - project-vocab

    # --- MIGRATION: Cluster Events ---
    clusterEvents:
      enabled: true

    # --- Disable Heavy Features ---
    # Explicitly disable these features at root level if they exist
    kepler:
      enabled: false
    beyla:
      enabled: false
    
    # Configure Alloy (Agent) resources
    alloy:
      alloy-metrics:
        resources:
          requests:
            cpu: 50m
            memory: 200Mi
          limits:
            memory: 500Mi