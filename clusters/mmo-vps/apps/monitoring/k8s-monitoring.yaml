apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s-monitoring
      version: "1.6.5" # Stable version
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

  install:
    createNamespace: true
  targetNamespace: monitoring

  valuesFrom:
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_HOST
      targetPath: externalServices.prometheus.host
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_USERNAME
      targetPath: externalServices.prometheus.basicAuth.username
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_PASSWORD
      targetPath: externalServices.prometheus.basicAuth.password
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_HOST
      targetPath: externalServices.loki.host
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_USERNAME
      targetPath: externalServices.loki.basicAuth.username
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_PASSWORD
      targetPath: externalServices.loki.basicAuth.password

  values:
    cluster:
      name: "mmo-vps"

    externalServices:
      prometheus:
        secret:
          create: true
          name: "prometheus-k8s-monitoring"
      loki:
        secret:
          create: true
          name: "loki-k8s-monitoring"

    metrics:
      enabled: true
      cost:
        enabled: false
      node-exporter:
        enabled: true
      kube-state-metrics:
        enabled: true

      alloy:
        enabled: true
        resources:
          requests:
            cpu: 50m
            memory: 200Mi
          limits:
            memory: 500Mi

        extraRelabelingRules: |
          rule {
            action        = "drop"
            source_labels = ["__name__"]
            regex         = "container_network_.*"
          }
          rule {
            action        = "drop"
            source_labels = ["__name__"]
            regex         = "kube_pod_owner"
          }

    logs:
      enabled: true
      pod_logs:
        enabled: true
        namespaces:
          - default
          - kube-system
          - flux-system
          - monitoring
          - shared
          - project-vocab
      cluster_events:
        enabled: true

    receivers:
      grpc: { enabled: false }
      http: { enabled: false }
      zipkin: { enabled: false }
    kepler:
      enabled: false
