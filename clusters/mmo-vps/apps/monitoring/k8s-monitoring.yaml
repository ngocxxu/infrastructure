apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring
spec:
  interval: 1h

  chart:
    spec:
      chart: k8s-monitoring
      version: "^3.6.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

  install:
    createNamespace: true

  targetNamespace: monitoring

  # 1. Inject secrets from DopplerSecret
  valuesFrom:
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_HOST
      targetPath: externalServices.prometheus.host

    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_USERNAME
      targetPath: externalServices.prometheus.basicAuth.username

    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_PASSWORD
      targetPath: externalServices.prometheus.basicAuth.password

    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_HOST
      targetPath: externalServices.loki.host

    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_USERNAME
      targetPath: externalServices.loki.basicAuth.username

    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_PASSWORD
      targetPath: externalServices.loki.basicAuth.password

  # 2. Configure Values
  values:
    cluster:
      name: "mmo-vps"

    # Don't create secret because we inject from valuesFrom
    externalServices:
      prometheus:
        secret:
          create: false
      loki:
        secret:
          create: false

    alloy:
      enabled: true

      # Reduce RAM for small VPS
      resources:
        requests:
          cpu: 50m
          memory: 200Mi
        limits:
          memory: 400Mi

    metrics:
      pipelines:
        kubernetes:
          enabled: true

          # Reduce cardinality
          metricRelabelings:
            - action: drop
              regex: "container_network_.*"
              sourceLabels: ["__name__"]

    logs:
      pipelines:
        kubernetes:
          enabled: true
          namespaces:
            - default
            - kube-system
            - flux-system
            - monitoring
            - shared
            - project-vocab

    # Disable all features that consume resources
    cost:
      enabled: false
    kepler:
      enabled: false
    beyla:
      enabled: false
