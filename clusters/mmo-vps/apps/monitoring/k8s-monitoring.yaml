apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: k8s-monitoring
      version: "1.6.5"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system

  install:
    createNamespace: true
  targetNamespace: monitoring

  valuesFrom:
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_HOST
      targetPath: externalServices.prometheus.host
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_USERNAME
      targetPath: externalServices.prometheus.basicAuth.username
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_PASSWORD
      targetPath: externalServices.prometheus.basicAuth.password
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_HOST
      targetPath: externalServices.loki.host
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_USERNAME
      targetPath: externalServices.loki.basicAuth.username
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_PASSWORD
      targetPath: externalServices.loki.basicAuth.password

  values:
    cluster:
      name: "mmo-vps"

    externalServices:
      prometheus:
        secret:
          create: true
          name: prometheus-k8s-monitoring
          namespace: monitoring
      loki:
        secret:
          create: true
          name: loki-k8s-monitoring
          namespace: monitoring

    opencost:
      enabled: false

    metrics:
      enabled: true
      cost:
        enabled: false
      
      node-exporter:
        enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 10Mi
          limits:
            cpu: 20m
            memory: 20Mi
      
      kube-state-metrics:
        enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 20Mi
          limits:
            cpu: 20m
            memory: 40Mi

      alloy:
        enabled: true
        # Observed ~320Mi, was at 91% of the old 350Mi limit (OOMKill risk).
        resources:
          requests:
            cpu: 20m
            memory: 340Mi
          limits:
            cpu: 100m
            memory: 512Mi
        extraRelabelingRules: |
          rule {
            action        = "drop"
            source_labels = ["__name__"]
            regex         = "container_network_.*"
          }
          rule {
            action        = "drop"
            source_labels = ["__name__"]
            regex         = "kube_pod_owner"
          }

    logs:
      enabled: true
      pod_logs:
        enabled: true
        namespaces:
          - default
          - kube-system
          - flux-system
          - monitoring
          - shared
          - project-vocab
        # Observed ~77Mi, was at 77% of the old 100Mi limit.
        resources:
          requests:
            cpu: 20m
            memory: 96Mi
          limits:
            cpu: 60m
            memory: 160Mi

      cluster_events:
        enabled: false 

    receivers:
      grpc: { enabled: false }
      http: { enabled: false }
      zipkin: { enabled: false }
    kepler:
      enabled: false