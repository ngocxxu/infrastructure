apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-monitoring
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s-monitoring
      version: "^3.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  install:
    createNamespace: true
  targetNamespace: monitoring

  # 1. Configure inject Secret from DopplerSecret
  valuesFrom:
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_HOST
      targetPath: externalServices.prometheus.host
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_USERNAME
      targetPath: externalServices.prometheus.basicAuth.username
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_PROMETHEUS_PASSWORD
      targetPath: externalServices.prometheus.basicAuth.password
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_HOST
      targetPath: externalServices.loki.host
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_USERNAME
      targetPath: externalServices.loki.basicAuth.username
    - kind: Secret
      name: grafana-cloud-env
      valuesKey: GRAFANA_LOKI_PASSWORD
      targetPath: externalServices.loki.basicAuth.password

  # 2. Configure Values for k8s-monitoring
  values:
    cluster:
      name: "mmo-vps"

    # Metrics Tuning (Keep as you did is very good for free package)
    metrics:
      enabled: true
      cost:
        enabled: false
      node-exporter:
        enabled: true
      kube-state-metrics:
        enabled: true
      agent:
        extraRelabelingRules: |
          - action: drop
            source_labels: [__name__]
            regex: "grafana_agent_.*|alloy_.*"
          - action: drop
            source_labels: [__name__]
            regex: "container_network_.*"

    # Logs Tuning
    logs:
      enabled: true
      pod_logs:
        enabled: true
        namespaces:
          - default
          - kube-system
          - flux-system
          - monitoring
          - shared
          - project-vocab # Only get logs of these namespaces

    # Disable unnecessary features to save RAM
    receivers:
      grpc: { enabled: false }
      http: { enabled: false }
      zipkin: { enabled: false }
    opencost: { enabled: false }
    kepler: { enabled: false }
