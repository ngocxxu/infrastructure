# DopplerSecret for redis cache
# Map password key for Bitnami chart, bulk load other variables
# All variables from Doppler will be loaded with their original names (UPPERCASE if set in Doppler)
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: redis-secret-ref
  namespace: shared
spec:
  # Reference to the Kubernetes Secret containing Doppler service token
  # This secret must be created manually: kubectl create secret generic doppler-token-redis --namespace shared --from-literal=serviceToken=dp.st.xxxxx
  tokenSecret:
    name: doppler-token-redis
    namespace: shared
  # The Kubernetes Secret that will be created/updated by Doppler Operator
  managedSecret:
    name: redis-env
    namespace: shared
  # Map password to the key name Bitnami expects
  # All other variables (REDIS_IO_THREADS, etc.) will be loaded with original UPPERCASE names
  secrets:
    - originalName: REDIS_PASSWORD
      managedName: redis-password

