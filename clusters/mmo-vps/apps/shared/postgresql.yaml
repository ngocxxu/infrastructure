apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: shared
spec:
  interval: 5m
  chart:
    spec:
      chart: postgresql
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      version: "18.1.14"
  targetNamespace: shared
  install:
    createNamespace: true
  values:
    global:
      postgresql:
        auth:
          # Use existing secret from DopplerSecret
          # Password is available as POSTGRES_PASSWORD (UPPERCASE) in the secret
          existingSecret: postgresql-env
          secretKeys:
            adminPasswordKey: POSTGRES_PASSWORD
            userPasswordKey: POSTGRES_PASSWORD
    primary:
      # Load all other environment variables from Doppler secret
      # All variables with UPPERCASE names from Doppler will be available
      extraEnvVarsSecret: postgresql-env
      persistence:
        enabled: true
        size: 1Gi
        storageClass: "local-path"
      resources:
        limits:
          memory: 100Mi
          cpu: 50m
        requests:
          memory: 50Mi
          cpu: 25m
      podSecurityContext:
        fsGroup: 1001
      containerSecurityContext:
        runAsUser: 1001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: 17.6.0-debian-12-r4
