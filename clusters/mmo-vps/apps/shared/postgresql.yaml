apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgresql
  namespace: shared
spec:
  interval: 5m
  releaseName: postgresql
  chart:
    spec:
      chart: postgresql
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      version: "18.1.14"
  targetNamespace: shared
  install:
    createNamespace: true
  values:
    global:
      postgresql:
        auth:
          # Use existing secret from DopplerSecret
          # All auth values should be in postgresql-env secret from Doppler
          existingSecret: postgresql-env
          secretKeys:
            adminPasswordKey: POSTGRES_PASSWORD
            userPasswordKey: POSTGRES_PASSWORD
            usernameKey: POSTGRES_USERNAME
            databaseKey: POSTGRES_DATABASE
    primary:
      # Load all other environment variables from Doppler secret
      # All variables with UPPERCASE names from Doppler will be available
      extraEnvVarsSecret: postgresql-env
      persistence:
        enabled: true
        size: 1Gi
        storageClass: "local-path"
      # 150Mi limit against ~62-71Mi observed = ~2x headroom. Still worth
      # watching: Postgres allocates work_mem PER SORT/HASH operation, so
      # concurrent heavier queries can spike above steady-state, and an
      # OOMKill here takes down BOTH vocab and n8n, since they share this
      # instance.
      resources:
        limits:
          memory: 150Mi
          cpu: 100m
        requests:
          memory: 96Mi
          cpu: 50m
      podSecurityContext:
        fsGroup: 1001
      containerSecurityContext:
        runAsUser: 1001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
      livenessProbe:
        enabled: true
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
        successThreshold: 1
      readinessProbe:
        enabled: true
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 6
    image:
      registry: docker.io
      repository: bitnamilegacy/postgresql
      tag: 17.6.0-debian-12-r4
