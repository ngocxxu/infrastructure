# DopplerSecret for Sequin (Postgres CDC)
# Map password key for Bitnami-style chart, bulk load other variables
# All variables from Doppler will be loaded with their original names (UPPERCASE if set in Doppler)
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: sequin-secret-ref
  namespace: shared
spec:
  # Reference to the Kubernetes Secret containing Doppler service token
  # This secret must be created manually: kubectl create secret generic doppler-token-sequin --namespace shared --from-literal=serviceToken=dp.st.xxxxx
  tokenSecret:
    name: doppler-token-sequin
    namespace: shared
  # The Kubernetes Secret that will be created/updated by Doppler Operator
  # All variables from Doppler will be loaded with their original names (UPPERCASE if set in Doppler)
  #
  # Doppler config for this project needs (see sequin.yaml for how each is used):
  #   SEQUIN_PG_USER            - copy of POSTGRES_USERNAME from the postgresql-env project
  #   SEQUIN_PG_PASSWORD        - copy of POSTGRES_PASSWORD from the postgresql-env project
  #   SEQUIN_REDIS_PASSWORD     - copy of REDIS_PASSWORD from the redis-env project
  #   SEQUIN_CDC_WEBHOOK_TOKEN  - must equal CDC_WEBHOOK_TOKEN in vocab-be's own Doppler config
  managedSecret:
    name: sequin-env
    namespace: shared
