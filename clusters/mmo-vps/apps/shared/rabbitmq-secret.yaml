# DopplerSecret for RabbitMQ
# Required variables in the Doppler project:
#   RABBITMQ_PASSWORD       - broker password for the `app` user
#   RABBITMQ_ERLANG_COOKIE  - shared cluster secret. Single node still
#                             needs it: it is baked into the data dir on
#                             first boot, and a changed cookie later makes
#                             the node refuse to start against its own PVC.
#                             Generate once, never rotate casually:
#                               openssl rand -hex 32
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: rabbitmq-secret-ref
  namespace: shared
spec:
  # This secret must be created manually:
  #   kubectl create secret generic doppler-token-rabbitmq \
  #     --namespace shared --from-literal=serviceToken=dp.st.xxxxx
  tokenSecret:
    name: doppler-token-rabbitmq
    namespace: shared
  managedSecret:
    name: rabbitmq-env
    namespace: shared
