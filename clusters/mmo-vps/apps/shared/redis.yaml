apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis
  namespace: shared
spec:
  interval: 5m
  releaseName: redis
  chart:
    spec:
      chart: redis
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
      version: "24.0.8"
  targetNamespace: shared
  install:
    createNamespace: true
  values:
    image:
      repository: bitnamilegacy/redis
      tag: 8.2.1-debian-12-r0
    auth:
      enabled: true
      # Use existing secret from DopplerSecret
      # Password is available as REDIS_PASSWORD (UPPERCASE) in the secret
      existingSecret: redis-env
      existingSecretPasswordKey: REDIS_PASSWORD
    master:
      # Load all other environment variables from Doppler secret
      # All variables with UPPERCASE names from Doppler will be available
      extraEnvVarsSecret: redis-env
      persistence:
        enabled: true
        size: 1Gi
        storageClass: "local-path"
      resources:
        limits:
          memory: 64Mi
          cpu: 150m
        requests:
          memory: 24Mi
          cpu: 50m
      readinessProbe:
        exec:
          command:
            ["bash", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping | grep PONG']
      livenessProbe:
        exec:
          command:
            ["bash", "-c", 'redis-cli -a "$REDIS_PASSWORD" ping | grep PONG']
      podSecurityContext:
        fsGroup: 1001
      containerSecurityContext:
        runAsUser: 1001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
    replica:
      # Disabled: this cluster is a single VPS node, so master and replica
      # always die together — zero failover benefit, and nothing here reads
      # from the replica endpoint (grepped the repo, no consumer references
      # it). It was ~28Mi of RAM bought for a redundancy guarantee this
      # topology can't actually provide. Re-enable if the cluster ever
      # spans >=1 node, or if a client starts doing explicit read-scaling
      # against the replica service.
      # Load all other environment variables from Doppler secret
      # All variables with UPPERCASE names from Doppler will be available
      extraEnvVarsSecret: redis-env
      replicaCount: 0
      persistence:
        enabled: true
        size: 0.5Gi
        storageClass: "local-path"
      resources:
        limits:
          memory: 64Mi
          cpu: 150m
        requests:
          memory: 24Mi
          cpu: 50m
      readinessProbe:
        enabled: false
      livenessProbe:
        enabled: false
      podSecurityContext:
        fsGroup: 1001
      containerSecurityContext:
        runAsUser: 1001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
