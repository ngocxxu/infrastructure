apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vocab-be
  namespace: project-vocab
spec:
  interval: 5m
  releaseName: vocab-be
  values:
    image:
      ref: docker.io/ngocxxu/vocab-be:1.3.3 # {"$imagepolicy": "flux-system:vocab-be-semver"}
  dependsOn:
    - name: postgresql
      namespace: shared
  chart:
    spec:
      chart: ./helms/vocab-be
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  targetNamespace: project-vocab
  install:
    createNamespace: true
    timeout: 15m
    disableWaitForJobs: true
    remediation:
      retries: 2
      remediateLastFailure: true
  upgrade:
    timeout: 15m
    disableWaitForJobs: true
    remediation:
      retries: 2
      remediateLastFailure: true
      strategy: uninstall
