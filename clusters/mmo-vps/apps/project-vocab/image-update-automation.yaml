apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: project-vocab-images
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcd-bot
        email: fluxcd-bot@noreply.ngocquach.com
      messageTemplate: "chore(images): update project-vocab images"
    push:
      branch: main
  update:
    path: ./clusters/mmo-vps/apps/project-vocab
    strategy: Setters

