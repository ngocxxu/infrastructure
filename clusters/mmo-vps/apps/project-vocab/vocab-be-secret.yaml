# DopplerSecret for vocab-be application
# Bulk load all environment variables from Doppler without mapping
# All variables will be loaded as-is (if uppercase in Doppler, stays uppercase)
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: vocab-be-secret-ref
  namespace: project-vocab
spec:
  # Reference to the Kubernetes Secret containing Doppler service token
  # This secret must be created manually: kubectl create secret generic doppler-token-vocab-be --namespace project-vocab --from-literal=serviceToken=dp.st.xxxxx
  tokenSecret:
    name: doppler-token-vocab-be
    namespace: project-vocab
  # The Kubernetes Secret that will be created/updated by Doppler Operator
  # All variables from Doppler will be loaded with their original names (UPPERCASE if set in Doppler)
  managedSecret:
    name: vocab-be-env
    namespace: project-vocab
  # No nameTransformer needed - keeps original names from Doppler
  # If variables in Doppler are UPPERCASE, they will remain UPPERCASE

