# new-api — LLM API gateway (Go binary + embedded React UI, SQLite).
#
# Deployed alongside omniroute for an A/B memory comparison; omniroute stays
# running and untouched. See the sizing note on resources below.
#
# SECURITY: there is no default password — createRootAccountIfNeed() in
# model/main.go is dead code with no callers. main.go calls CheckSetup()
# instead, which leaves the instance in an uninitialised state served by
# controller/setup.go. PostSetup there is UNAUTHENTICATED: the first request
# to reach /setup on a fresh database claims the admin account. Complete the
# setup wizard immediately after the first rollout; until you do, this URL is
# open to whoever finds it.
#
# Storage: SQLite lives in /data on the PVC. No PostgreSQL/Redis needed;
# the upstream docker-compose pulls both in, but that is the multi-node
# path and would cost ~250Mi+ extra on a node already at ~102% allocated.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: new-api-data
  namespace: external
  labels:
    app.kubernetes.io/name: new-api
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: new-api
  namespace: external
  labels:
    app.kubernetes.io/name: new-api
spec:
  replicas: 1
  # SQLite on a ReadWriteOnce PVC: two pods must never hold the file open at
  # once, so the old pod is torn down before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: new-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: new-api
    spec:
      containers:
        - name: new-api
          image: calciumion/new-api:v1.0.0-rc.31
          imagePullPolicy: IfNotPresent
          args: ["--log-dir", "/app/logs"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: TZ
              value: "Asia/Ho_Chi_Minh"
            - name: ERROR_LOG_ENABLED
              value: "true"
            # No SQL_DSN => SQLite at /data/one-api.db. No Redis => in-process
            # cache, which is correct for a single replica.
            #
            # These two default to 32 and 64 and are PER IN-FLIGHT REQUEST, so
            # they are the knob that decides whether concurrency blows the
            # memory limit below. Lowered because this instance proxies chat
            # traffic, not image/base64 payloads. Raise MAX_REQUEST_BODY_MB if
            # you start getting 413s.
            - name: MAX_REQUEST_BODY_MB
              value: "16"
            - name: STREAM_SCANNER_MAX_BUFFER_MB
              value: "16"
          # UNMEASURED. Upstream publishes no RSS figure and neither does the
          # chart-less README, so these are a starting guess for a Go binary
          # serving static assets + SQLite, not an observed value like the
          # numbers on omniroute and n8n.
          #
          # The node is already ~102% allocated, so the request is deliberately
          # small. Run `kubectl top pod -n external new-api` after ~24h of real
          # traffic and correct both numbers before trusting them.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          # /api/status is what upstream's own compose healthcheck hits.
          readinessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/status
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /data
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: new-api-data
        # Logs are not worth a PVC on a disk already at 82%; they die with
        # the pod, and errors are also visible via `kubectl logs`.
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: new-api
  namespace: external
  labels:
    app.kubernetes.io/name: new-api
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: new-api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: new-api
  namespace: external
  labels:
    app.kubernetes.io/name: new-api
spec:
  ingressClassName: traefik
  # No tls block: TLS terminates upstream, same as n8n and omniroute.
  rules:
    - host: new-api.ngocquach.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: new-api
                port:
                  number: 3000
