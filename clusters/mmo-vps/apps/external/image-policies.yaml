apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: omniroute-latest
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: omniroute
  filterTags:
    pattern: ^latest$
  policy:
    alphabetical:
      order: asc
