apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ============================================================
# NOTE: this directory previously had NO kustomization.yaml, so Flux
# auto-discovered every .yaml file in it. An explicit list is added here
# so individual apps can be disabled without deleting or mangling their
# manifests — same pattern already used in flux-system/kustomization.yaml.
#
# IMPORTANT: apps-external has `prune: true`. Removing an entry from this
# list makes Flux DELETE those objects from the cluster on the next
# reconcile. The file stays in git; the workload does not stay in k8s.
# ============================================================

resources:
  - image-policies.yaml
  - image-update-automation.yaml
  - omniroute.yaml

  # --- cliproxyapi: trial, running ALONGSIDE omniroute for a memory A/B.
  # Replaces new-api (BYOK key-manager) — this one logs into free-tier CLI
  # subscriptions (Codex/Claude/Gemini/Antigravity) via OAuth instead, same
  # mechanism as omniroute/9router but on a bare Go binary. See new-api.yaml's
  # git history if that trial needs resurrecting.
  #
  # Requires the `cliproxyapi-config` Secret to exist BEFORE this rolls out —
  # the pod cannot start without it (config.yaml, which holds api-keys, is
  # mounted from that Secret). This is deliberate: leaving `api-keys` empty
  # makes the proxy answer /v1/chat/completions with NO auth at all — that is
  # documented upstream behaviour, not a bug (issue #2714) — so failing to
  # start beats starting open.
  - cliproxyapi.yaml

  # --- n8n: re-enabled ---
  # Note: previous uninstall ran `helm uninstall`, which dropped the 1Gi
  # local-path PVC. Workflow data itself lives in the external
  # PostgreSQL (shared/postgresql-0) and survives.
  - n8n.yaml
  - n8n-secret.yaml
