# ============================================================
# Debezium Operator - installs the debezium.io CRDs (incl. DebeziumServer)
# Ref: https://debezium.io/blog/2025/03/18/debezium-charts/
# ============================================================
# IMPORTANT: the actual CDC pipeline (the DebeziumServer resource) is
# DELIBERATELY NOT in this file or this Kustomization. Flux's kustomize-
# controller dry-run-validates every resource in a Kustomization together
# before applying any of them. A DebeziumServer CR sitting next to the
# HelmRelease that installs its own CRD is a chicken-and-egg deadlock:
# the dry-run fails because the CRD doesn't exist yet, which blocks the
# WHOLE Kustomization - including the HelmRelease that would have
# created the CRD - forever. (This happened: apps-external went
# `Ready: False` and every other app in it stopped reconciling too.)
#
# The DebeziumServer CR lives in its own Kustomization
# (clusters/mmo-vps/apps/debezium-pipeline/) with an explicit
# `dependsOn: [apps-external]`, so Flux only dry-runs it after this
# HelmRelease is confirmed Ready - i.e. after the CRD actually exists.
# ============================================================

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: debezium-operator
  namespace: external
spec:
  interval: 10m
  chart:
    spec:
      chart: debezium-operator
      sourceRef:
        kind: HelmRepository
        name: debezium
        namespace: flux-system
  install:
    createNamespace: true
    timeout: 10m
    remediation:
      retries: 2
  upgrade:
    timeout: 10m
    remediation:
      retries: 2
  values:
    # The operator itself is a normal-sized k8s controller, not a CDC
    # engine - this is NOT part of the 300Mi budget above, that number
    # is for the DebeziumServer pod the operator manages.
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        cpu: 200m
        memory: 160Mi

---
# Credentials for Postgres source + RabbitMQ Stream sink.
# Same Doppler pattern already used for n8n/redis/rabbitmq.
#
# Required keys in the "debezium" Doppler project:
#   DB_POSTGRESDB_USER, DB_POSTGRESDB_PASSWORD  - a REPLICATION-privileged
#     role, not the app's normal DB user (logical replication needs
#     REPLICATION grant, which is broader than a typical app role should have)
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: debezium-secret-ref
  namespace: external
spec:
  tokenSecret:
    name: doppler-token-debezium
    namespace: external
  managedSecret:
    name: debezium-env
    namespace: external
