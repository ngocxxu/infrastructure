apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: external
spec:
  interval: 5m
  releaseName: n8n
  values:
    ingress:
      enabled: true
    image:
      ref: docker.io/n8nio/n8n:latest # {"$imagepolicy": "flux-system:n8n-latest"}
    envFromSecret: n8n-env
    resources:
      requests:
        memory: 100Mi
        cpu: 50m
      limits:
        memory: 200Mi
        cpu: 150m
  dependsOn:
  - name: postgresql
    namespace: shared
  chart:
    spec:
      chart: ./helms/n8n
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  targetNamespace: external
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 2
      remediateLastFailure: true
  upgrade:
    timeout: 15m
    remediation:
      retries: 2
      remediateLastFailure: true
      strategy: uninstall
