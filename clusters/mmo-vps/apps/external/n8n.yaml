apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: external
spec:
  interval: 5m
  releaseName: n8n
  chart:
    spec:
      chart: n8n
      version: "1.16.36"
      sourceRef:
        kind: HelmRepository
        name: community-charts
        namespace: flux-system
  targetNamespace: external
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 2
  upgrade:
    timeout: 15m
    remediation:
      retries: 2
  dependsOn:
  - name: postgresql
    namespace: shared
  values:
    image:
      repository: n8nio/n8n
      tag: "1.95.0"
      pullPolicy: IfNotPresent

    # Database configuration
    db:
      type: postgresdb

    externalPostgresql:
      host: postgresql.shared.svc.cluster.local
      port: 5432
      database: n8n
      username: n8n
      existingSecret: n8n-env

    # Encryption key
    existingEncryptionKeySecret: n8n-env # Secret containing N8N_ENCRYPTION_KEY

    # Main node configuration
    main:
      count: 1
      resources:
        requests:
          memory: 100Mi
          cpu: 50m
        limits:
          memory: 200Mi
          cpu: 150m
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 60
        periodSeconds: 15
        failureThreshold: 5
      readinessProbe:
        httpGet:
          path: /healthz/readiness
          port: http
        initialDelaySeconds: 45
        periodSeconds: 10
        failureThreshold: 5
      extraEnvVars:
        GENERIC_TIMEZONE: "Asia/Ho_Chi_Minh"
        TZ: "Asia/Ho_Chi_Minh"
        N8N_PROTOCOL: "https"
        N8N_HOST: "n8n.ngocquach.com"
        WEBHOOK_URL: "https://n8n.ngocquach.com"

    # Ingress
    ingress:
      enabled: true
      className: traefik
      hosts:
      - host: n8n.ngocquach.com
        paths:
        - path: /
          pathType: Prefix

    # Timezone
    timezone: "Asia/Ho_Chi_Minh"
