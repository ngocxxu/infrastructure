apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: external
spec:
  interval: 5m
  releaseName: n8n
  chart:
    spec:
      chart: n8n
      version: "1.16.36"
      sourceRef:
        kind: HelmRepository
        name: community-charts
        namespace: flux-system
  targetNamespace: external
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 2
  upgrade:
    timeout: 15m
    remediation:
      retries: 2
  dependsOn:
  - name: postgresql
    namespace: shared
  values:
    image:
      tag: "2.16.0"

    # Main node
    main:
      count: 1
      # Steady-state is ~310Mi / 3m CPU, but n8n's BOOT is CPU-heavy
      # (Node.js startup + DB migrations) and takes ~45s.
      # A 50m request starved it during boot, the liveness probe timed out,
      # and kubelet killed it in a loop. Request is sized for STARTUP, not
      # steady-state; that is what the scheduler guarantees under contention.
      resources:
        requests:
          cpu: 250m
          memory: 384Mi
        limits:
          cpu: 1000m
          memory: 768Mi

      # The chart's default liveness probe fires before n8n finishes booting.
      # A startupProbe gives it up to 150s to come up, and only then does the
      # liveness probe take over. This is the correct fix for slow-start apps —
      # inflating initialDelaySeconds instead would also delay crash detection
      # forever after startup.
      startupProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 15
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 15

      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        periodSeconds: 20
        timeoutSeconds: 10
        failureThreshold: 3

      readinessProbe:
        httpGet:
          path: /healthz
          port: http
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3

      # Load ALL env vars from Doppler (bao gồm passwords, encryption key)
      extraSecretNamesForEnvFrom:
      - n8n-env
      # Override/add specific env vars
      extraEnvVars:
        # Database connection
        DB_TYPE: "postgresdb"
        DB_POSTGRESDB_HOST: "postgresql.shared.svc.cluster.local"
        DB_POSTGRESDB_PORT: "5432"
        DB_POSTGRESDB_DATABASE: "n8n"
        # DB_POSTGRESDB_USER # Loaded from secret
        # DB_POSTGRESDB_PASSWORD # Loaded from secret

        # n8n config
        N8N_HOST: "n8n.ngocquach.com"
        N8N_PROTOCOL: "https"
        N8N_PORT: "5678"
        WEBHOOK_URL: "https://n8n.ngocquach.com"

      #   # Timezone
      #   GENERIC_TIMEZONE: "Asia/Ho_Chi_Minh"
      #   TZ: "Asia/Ho_Chi_Minh"

      persistence:
        enabled: true
        size: 1Gi
        storageClass: local-path

    # Ingress
    ingress:
      enabled: true
      className: traefik
      hosts:
      - host: n8n.ngocquach.com
        paths:
        - path: /
          pathType: Prefix
