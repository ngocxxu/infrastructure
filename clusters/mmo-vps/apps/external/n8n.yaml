apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: n8n
  namespace: external
spec:
  interval: 5m
  releaseName: n8n
  chart:
    spec:
      chart: n8n
      version: "1.16.36"
      sourceRef:
        kind: HelmRepository
        name: community-charts
        namespace: flux-system
  targetNamespace: external
  install:
    createNamespace: true
    timeout: 15m
    remediation:
      retries: 2
  upgrade:
    timeout: 15m
    remediation:
      retries: 2
  dependsOn:
  - name: postgresql
    namespace: shared
  values:
    image:
      tag: "2.16.0"

    # Main node
    main:
      count: 1

      # n8n builds the Google OAuth callback URL from N8N_EDITOR_BASE_URL, and
      # the chart only honours this value. Left empty, the chart derives the URL
      # from the ingress and hardcodes http:// unless `ingress.tls` is set (TLS
      # terminates upstream here, so it never is). An http:// callback fails
      # every Google OAuth connect with redirect_uri_mismatch, and Google refuses
      # to publish an OAuth client that carries any non-HTTPS redirect URI.
      # Setting it through extraEnvVars does NOT work: the chart emits its own
      # N8N_EDITOR_BASE_URL entry earlier in the env list and that one wins.
      editorBaseUrl: "https://n8n.ngocquach.com"
      # Steady-state is ~310Mi / 3m CPU, but n8n's BOOT is CPU-heavy
      # (Node.js startup + DB migrations) and takes ~45s.
      # A 50m request starved it during boot, the liveness probe timed out,
      # and kubelet killed it in a loop. Request is sized for STARTUP, not
      # steady-state; that is what the scheduler guarantees under contention.
      resources:
        requests:
          cpu: 250m
          memory: 384Mi
        limits:
          cpu: 1000m
          memory: 768Mi

      # ponytail: chart 1.16.36's values schema doesn't allow `main.startupProbe`
      # (rejected on install). Fallback: widen initialDelaySeconds/failureThreshold
      # on liveness+readiness instead, to cover the ~45s boot. Upgrade path: if a
      # future chart version adds startupProbe support, switch back to that —
      # it's the more correct fix since it doesn't also delay crash detection
      # after a successful boot.
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 60
        periodSeconds: 20
        timeoutSeconds: 10
        failureThreshold: 5

      readinessProbe:
        httpGet:
          path: /healthz
          port: http
        initialDelaySeconds: 45
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5

      # Load ALL env vars from Doppler (bao gồm passwords, encryption key)
      extraSecretNamesForEnvFrom:
      - n8n-env
      # Override/add specific env vars
      extraEnvVars:
        # Database connection
        DB_TYPE: "postgresdb"
        DB_POSTGRESDB_HOST: "postgresql.shared.svc.cluster.local"
        DB_POSTGRESDB_PORT: "5432"
        DB_POSTGRESDB_DATABASE: "n8n"
        # DB_POSTGRESDB_USER # Loaded from secret
        # DB_POSTGRESDB_PASSWORD # Loaded from secret

        # n8n config
        N8N_HOST: "n8n.ngocquach.com"
        N8N_PROTOCOL: "https"
        N8N_PORT: "5678"
        WEBHOOK_URL: "https://n8n.ngocquach.com"

        # The autopost workflow pipes video files through Drive -> YouTube -> Facebook.
        # n8n's default binary mode holds every file in RAM as base64 (~33% larger than
        # the file) and copies it between nodes, which OOMKilled this pod at the 768Mi
        # limit. Raising that limit is not the fix: the k8s node already allocates 102%
        # of its memory. Spooling binaries to the PVC keeps RAM flat regardless of clip
        # size.
        N8N_DEFAULT_BINARY_DATA_MODE: "filesystem"

        # Clips run ~200MB each and the host disk is already 82% full, shared with every
        # other workload. Successful runs are not persisted at all, so their spooled
        # video is discarded the moment the execution ends and steady-state disk use
        # stays near zero. The Google Sheet (status/posted_at) is the durable record
        # that a clip went out, so nothing is lost by dropping these.
        EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
        # Failures are still kept: without them a clip could silently never post.
        # 24h is long enough to notice and re-queue the row.
        EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
        EXECUTIONS_DATA_MAX_AGE: "24"
        EXECUTIONS_DATA_PRUNE_MAX_COUNT: "50"

      #   # Timezone
      #   GENERIC_TIMEZONE: "Asia/Ho_Chi_Minh"
      #   TZ: "Asia/Ho_Chi_Minh"

      persistence:
        enabled: true
        size: 1Gi
        storageClass: local-path

    # Ingress
    ingress:
      enabled: true
      className: traefik
      hosts:
      - host: n8n.ngocquach.com
        paths:
        - path: /
          pathType: Prefix
