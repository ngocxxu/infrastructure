apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paracord-store-be
  namespace: project-paracord-store
spec:
  interval: 5m
  releaseName: paracord-store-be
  values:
    image:
      ref: docker.io/ngocxxu/paracord-store-be:latest # {"$imagepolicy": "flux-system:paracord-store-be-semver"}
  dependsOn:
    - name: postgresql
      namespace: shared
  chart:
    spec:
      chart: ./helms/paracord-store-be
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
  targetNamespace: project-paracord-store
  install:
    createNamespace: true
    timeout: 15m
    disableWaitForJobs: true
    remediation:
      retries: 2
      remediateLastFailure: true
  upgrade:
    timeout: 15m
    disableWaitForJobs: true
    remediation:
      retries: 2
      remediateLastFailure: true
      strategy: uninstall
