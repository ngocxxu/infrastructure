apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vocab-fe
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: ./helms/vocab-fe
      sourceRef:
        kind: GitRepository
        name: infra-repo
        namespace: flux-system
  values:
    replicaCount: 1
    image:
      repository: ngocxxu/vocab-fe
      pullPolicy: Always
      tag: "latest"
    imagePullSecrets: []
    nameOverride: ""
    fullnameOverride: ""
    secrets:
      enabled: true
      nestjs:
        apiUrl: ""
      nextjs:
        publicApiUrl: ""
        telemetryDisabled: ""
        publicSocketUrl: ""
      clerk:
        secretKey: ""
        publishableKey: ""
      posthog:
        host: ""
      sentry:
        dsn: ""
        authToken: ""
        organization: ""
        project: ""
      cloudinary:
        url: ""
    serviceAccount:
      create: false
      automount: true
      annotations: {}
      name: ""
    podAnnotations: {}
    podLabels: {}
    podSecurityContext: {}
    securityContext: {}
    service:
      type: ClusterIP
      port: 3000
    ingress:
      enabled: true
      className: "traefik"
      annotations: {}
      hosts:
        - host: vocab.ngocquach.top
          paths:
            - path: /
              pathType: Prefix
    resources:
      limits:
        memory: 120Mi
      requests:
        memory: 60Mi
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 100
      targetCPUUtilizationPercentage: 80
    volumes: []
    volumeMounts: []
    nodeSelector: {}
    tolerations: []
    affinity: {}

