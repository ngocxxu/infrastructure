---
- name: Check if K3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

# 0. Node resource reservations - MUST be written before the installer runs,
#    so a fresh node comes up with correct Allocatable from the very first
#    boot instead of needing a second restart. On an existing node the
#    handler restarts k3s to pick up changes.
- name: Ensure k3s config directory exists
  file:
    path: /etc/rancher/k3s
    state: directory
    mode: '0755'
  become: true

- name: Configure kubelet resource reservations and eviction thresholds
  template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: '0644'
  become: true
  notify: restart k3s

# 1. Install K3s by main script
- name: Install K3s Server
  shell: |
    curl -sfL https://get.k3s.io | sh -
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    K3S_TOKEN: "{{ k3s_token }}"
    # Disable Traefik by default (if you want to install Nginx Ingress later)
    # INSTALL_K3S_EXEC: "--disable=traefik" 
  when: not k3s_binary.stat.exists

# 2. Wait for K3s to be ready
- name: Wait for K3s API to be ready
  wait_for:
    port: 6443
    delay: 10
    timeout: 300

# 3. Get kubeconfig from VPS
- name: Read remote kubeconfig
  slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: remote_kubeconfig
  become: true

# 4. Rewrite kubeconfig with a real context name and save to local machine
#    k3s names the cluster/user/context all "default". Left as-is, every
#    run of this role clobbers a locally-renamed context back to "default".
- name: Parse remote kubeconfig
  set_fact:
    _k3s_kubeconfig: "{{ remote_kubeconfig['content'] | b64decode | from_yaml }}"

- name: Check for an existing local kubeconfig
  stat:
    path: "{{ local_kubeconfig_path }}"
  register: local_kubeconfig_stat
  delegate_to: localhost
  become: false

# An existing kubeconfig is the operator's file, not ours. It may hold
# extra contexts, other clusters, or hand-tuned settings that this role
# knows nothing about, so it is NEVER overwritten. We only write it on a
# genuinely fresh machine where the file does not exist yet.
- name: Save kubeconfig to local machine (first-time bootstrap only)
  template:
    src: kubeconfig.j2
    dest: "{{ local_kubeconfig_path }}"
    mode: '0600'
  delegate_to: localhost
  become: false
  when: not local_kubeconfig_stat.stat.exists

# If the file already exists, drop the freshly generated one next to it so
# the operator can diff and merge by hand. This matters when the node is
# rebuilt or its certs rotate: the old kubeconfig silently stops working
# and this gives you the new credentials without a scavenger hunt.
- name: Write generated kubeconfig alongside for manual merge
  template:
    src: kubeconfig.j2
    dest: "{{ local_kubeconfig_path }}.generated"
    mode: '0600'
  delegate_to: localhost
  become: false
  when:
    - local_kubeconfig_stat.stat.exists
    - k3s_write_kubeconfig_merge_file | bool
  changed_when: false

- name: Explain that the existing kubeconfig was left alone
  debug:
    msg: >-
      {{ local_kubeconfig_path }} already exists and was NOT modified.
      A generated copy was written to {{ local_kubeconfig_path }}.generated —
      diff it and merge manually if the server address or certificates changed.
      To merge:  KUBECONFIG={{ local_kubeconfig_path }}:{{ local_kubeconfig_path }}.generated
      kubectl config view --flatten > merged && mv merged {{ local_kubeconfig_path }}
  when:
    - local_kubeconfig_stat.stat.exists
    - k3s_write_kubeconfig_merge_file | bool